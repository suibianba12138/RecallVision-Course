name: Build V3 source-frame stills (one-time)
on:
  push:
    branches: [feature/v3-storytelling-showcase-20261027]
    paths: [.github/workflows/v3-source-stills.yml, scripts/build_v3_source_stills.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v3-storytelling-showcase-20261027}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python scripts/build_v3_source_stills.py
      - name: Commit licensed still frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/media/
          if ! git diff --cached --quiet; then
            git commit -m "site(v3): add hash-verified sampled video frames for evidence story"
            git push origin HEAD:feature/v3-storytelling-showcase-20261027
          fi
