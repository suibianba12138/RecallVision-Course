[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recallvision"
version = "0.1.0"
description = "Structured visual memory contracts for long-form indoor video question answering."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
perception = [
    "ultralytics==8.4.171",
    "opencv-python>=4.11",
]

[tool.setuptools.packages.find]
include = ["recallvision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
